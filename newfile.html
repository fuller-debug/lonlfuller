<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Landing Page</title>
    <style>
        /* 1. THE CORE MODERN SETUP */
        html {
            scroll-behavior: smooth;
            /* Offset for the sticky nav height */
            scroll-padding-top: 70px; 
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            margin: 0;
            color: #2d3436;
        }

        /* 2. THE STICKY NAV */
        nav {
            position: sticky;
            top: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px); /* Modern "Glass" effect */
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
            border-bottom: 1px solid #eee;
        }

        nav a {
            text-decoration: none;
            color: #6366f1;
            font-weight: 600;
            padding: 0.5rem 1rem;
            transition: 0.3s;
        }

        /* Simple 'active' effect when hovering */
        nav a:hover { color: #4338ca; }

        /* 3. MODERN LAYOUT SECTIONS */
        section {
            min-height: 80vh; /* Fills most of the screen */
            padding: 4rem 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero { background: #f8fafc; text-align: center; }
        .about { background: #ffffff; }
        .services { background: #f1f5f9; }

        /* Modern Fluid Typography - gets smaller on mobile automatically */
        h1 { font-size: clamp(2rem, 5vw, 4rem); }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home" class="hero">
        <h1>Fresh Web Design 2026</h1>
        <p>No jQuery. No complex offsets. Just pure modern CSS.</p>
    </section>

    <section id="about" class="about">
        <h2>About Us</h2>
        <p>In 2015, we used floats. Now we use Flexbox and Grid.</p>
    </section>

    <section id="services" class="services">
        <h2>Services</h2>
        <p>Clicking the nav links above will scroll here smoothly.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>The sticky nav stays visible the whole time.</p>
    </section>

</body>
</html>
